services:
  denuncias-postgres:
    image: postgres:17
    container_name: puntoreporte-postgres17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=reportes_db
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - puntoreporte_pg17_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  puntoreporte_pg17_data: